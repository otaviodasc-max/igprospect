<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Conalvo</title>
  <link rel="manifest" href="manifest.json?v=20261014a">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Conalvo">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261014a">
  <link rel="icon" href="favicon.ico?v=20261014a" sizes="any">
  <link rel="icon" type="image/png" href="icon-192.png?v=20261014a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=20261013b">
</head>
<body>
  <!-- AUTH -->
  <div id="auth" class="auth-wrap">
    <div class="auth-bg"></div>
    <div class="auth-card" id="auth-card">
      <div class="auth-loading"><div class="spinner"></div><div class="auth-loading-txt">Carregando…</div></div>
    </div>
  </div>

  <!-- ONBOARDING -->
  <div id="onboard" class="auth-wrap hidden">
    <div class="auth-bg"></div>
    <div class="auth-card" id="onboard-card"></div>
  </div>

  <!-- SELEÇÃO DE EQUIPE (login com mais de uma equipe) -->
  <div id="org-select" class="auth-wrap hidden">
    <div class="auth-bg"></div>
    <div class="auth-card org-select-card" id="org-select-card"></div>
  </div>

  <!-- APP -->
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="s-logo">
        <div class="logo-ico cv-logo"><img src="conalvo-alvo.png" alt=""></div>
        <div><div class="l1">Conalvo</div><div class="l2">Prospecção e consórcio</div></div>
      </div>
      <nav class="s-nav" id="s-nav"></nav>
      <div class="s-foot">
        <div class="s-user" id="s-user">—</div>
        <div class="s-org" id="s-org">—</div>
        <div class="logout" id="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sair</div>
      </div>
    </aside>
    <div class="sb-overlay" id="sb-overlay"></div>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="tb-info"><div class="tb-title" id="tb-title">Dashboard</div><div class="tb-sub" id="tb-sub"></div></div>
        <div class="tb-controls" id="tb-controls"></div>
        <div class="period-tabs" id="period-tabs" style="display:none">
          <div class="period-tab active" data-period="all">Tudo</div>
          <div class="period-tab" data-period="30">30d</div>
          <div class="period-tab" data-period="7">7d</div>
          <div class="period-tab" data-period="1">Hoje</div>
        </div>
      </header>
      <div class="content" id="content"></div>
    </div>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <div id="modal-root"></div>
  <div class="toast-ctr" id="toast-ctr"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';</script>
  <!-- ?v= é cache-busting: sem isso o navegador servia o app.js antigo por horas
       depois do deploy, e um recurso novo simplesmente não aparecia na tela.
       Suba o número a cada deploy que mexa em app.js/app.css/modules.js. -->
  <script src="config.js?v=20261013b"></script>
  <script src="modules.js?v=20261013b"></script>
  <!-- painel Conalvo: conalvo-telas.js (Relatórios, Equipe, Configurações,
       Administração e telas de acesso) vem ANTES do app.js, que o instala
       antes do 1º desenho. Publicar os três juntos, com a mesma versão, e
       junto com as migrações de db/PUBLICACAO.md. -->
  <script src="conalvo-telas.js?v=20261013b"></script>
  <script src="app.js?v=20261013b"></script>
</body>
</html>
